<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>testgeo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">testgeo</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    <ion-item>
      <ion-button expand="block" color="success" (click)="obtenerUbicacion()" [disabled]="obteniendoUbicacion">
        <ion-icon name="location-outline" slot="start"></ion-icon>
        {{ obteniendoUbicacion ? 'Obteniendo GPS...' : 'Obtener Ubicación' }}
      </ion-button>
    </ion-item>
  <ion-item *ngIf="ubicacion">
    <div style="text-align: center; width: 100%;">
      <p><strong>Location:</strong></p>
      <p><strong>Latitud:</strong> {{ ubicacion.latitude }}</p>
      <p><strong>Longitud:</strong> {{ ubicacion.longitude }}</p>
      <p><strong>Precisión:</strong> {{ ubicacion.accuracy }} Metros</p>
    <ion-button size="small" fill="outline"[href]="obtenerEnlaceMaps()" target="_blank">
      <ion-icon name="map" slot="start"></ion-icon>
      Ver en Maps
  </ion-button>
  </div>
  </ion-item>
  </ion-list>
</ion-content>
